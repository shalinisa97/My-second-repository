
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gitronix Workshop Review</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .details {
            text-align: left;
            background: #eaf0ff;
            padding: 20px;
            border-left: 5px solid #3457d5;
            border-radius: 8px;
            margin-bottom: 25px;
            line-height: 1.9;
        }

        .details p {
            font-size: 17px;
        }

        h1 {
            font-size: 28px;
            color: #243b80;
            margin-bottom: 25px;
        }

        .meme {
            width: 100%;
            max-width: 850px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            h1 {
                font-size: 23px;
            }

            .details p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="details">
            <p><strong>Name:</strong> Shalini S A</p>
            <p><strong>Dept:</strong> CSE A</p>
            <p><strong>Event:</strong> GITRONIX</p>
        </div>

        <h1>Review of this Workshop</h1>

        <img
            src="meme.png"
            alt="Spider-Man Arumai meme"
            class="meme"
        >

    </div>

</body>
</html>
